# Полный стек сервиса. Из чистого клона достаточно одной команды:
#
#     docker compose up --build
#
# Порядок запуска гарантирован цепочкой условий:
#   postgres (healthy) -> migrator (успешно завершился) -> api
#
# Значения по умолчанию заданы прямо здесь, поэтому файл .env не обязателен;
# если он есть, его значения имеют приоритет.

name: finance-api

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Без -U/-d проверка выполняется от имени root к базе root и всегда
      # завершается ошибкой, поэтому пользователь и база указаны явно.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # Одноразовый сервис: применяет миграции и завершается. Миграция остаётся
  # отдельным наблюдаемым шагом, а не скрытым side-effect'ом старта API.
  migrator:
    build:
      context: .
    image: finance-api:local
    restart: "no"
    entrypoint: ["/migrator"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    image: finance-api:local
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}?sslmode=disable
      HTTP_ADDR: ":8080"
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Просмотр OpenAPI-спецификации. Поднимается только по запросу:
  #     docker compose --profile docs up
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    profiles: ["docs"]
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./api:/spec:ro

volumes:
  pgdata:
